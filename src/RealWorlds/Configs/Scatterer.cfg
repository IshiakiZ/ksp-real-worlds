// Real Worlds: Scatterer's skies at the real worlds' sizes.
// Scatterer's own settings (its Scatterer.Instance.mainSettings) are never touched; these are the per-planet skies that
// StockScattererConfigs (or any other set) gives, changed for the real atmospheres. Scatterer works out the sky's height
// itself from these and the planet's radius.

// Earth: the clear-sky figures of Bruneton & Neyret (2008, 2017): Rayleigh scattering 5.802, 13.558, 33.1 per thousand km
// (at 680, 550, 440 nm), its scale height 8 km; aerosols 1.2 km high, a little hazier than their very clear day; ozone
// round 25 km, its absorption (0.650, 1.881, 0.085) per thousand km.
@Scatterer_atmosphere:HAS[@Atmo:HAS[#name[Kerbin]]]:NEEDS[Scatterer]:FOR[RealWorlds]
{
	@Atmo:HAS[#name[Kerbin]]
	{
		%HR = 8
		%HM = 1.2
		%m_betaR = 0.005802,0.013558,0.0331
		%BETA_MSca = 0.008,0.008,0.008
		%m_mieG = 0.8
		%useOzone = True
		%ozoneAbsorption = 0.00065,0.001881,0.000085
		%ozoneHeight = 25
		%ozoneFalloff = 15
		// (the stock texture of Kerbin was dull and needed lifting; NASA's Blue Marble is as it was seen)
		%scaledLandBrightnessAdjust = 1
		%scaledLandContrastAdjust = 1
		%scaledLandSaturationAdjust = 1
		%adjustScaledTexture = False
		%specR = 0
		%specG = 0
		%specB = 0
	}
}

// Mars: carbon dioxide at 610 Pa and 210 K is 0.0083 of Earth's molecules at the ground, each scattering 2.45 times as
// much as air: Rayleigh about 0.02 of Earth's, its scale height 11.1 km. The dust does the rest: an optical depth about 0.5
// spread through the same 11 km, scattering red more than blue (its blue is absorbed): the butterscotch sky.
@Scatterer_atmosphere:HAS[@Atmo:HAS[#name[Duna]]]:NEEDS[Scatterer]:FOR[RealWorlds]
{
	@Atmo:HAS[#name[Duna]]
	{
		%HR = 11.1
		%HM = 11
		%m_betaR = 0.000118,0.000274,0.00067
		%BETA_MSca = 0.04,0.031,0.022
		%m_mieG = 0.65
	}
}

// Venus: carbon dioxide at 92 bar under a deck of sulphuric-acid cloud 48 to 70 km up. The air alone would scatter some 86
// times what Earth's does, too much for Scatterer's tables, and the deck it does not model. What is seen from space is the
// deck's own pale yellow (its far picture) under the thin air above it, which scatters about half what Earth's does at the
// ground: that, with the 15.9 km scale height of the real air, and the deck's glare as a haze 16 km high, nearly grey
// (Scatterer dims each colour by what its haze scatters: a yellow haze turned the yellow deck under it blue). From the
// ground the light is dimmed by half and yellowed by the air. No glint: the stock sky's specular was for Eve's sea.
// (2026-10-14 evening: with Earth's blue scattering at half strength the whole planet showed from space as a pale blue
// ball, the deck's yellow lost under it. The thin air's scattering is taken nearly grey, and the yellow given as Titan's
// orange is, by a little blue taken out in a layer round the deck's top, 60 km up.)
@Scatterer_atmosphere:HAS[@Atmo:HAS[#name[Eve]]]:NEEDS[Scatterer]:FOR[RealWorlds]
{
	@Atmo:HAS[#name[Eve]]
	{
		%HR = 15.9
		%HM = 16
		%m_betaR = 0.0042,0.0047,0.0055
		%BETA_MSca = 0.05,0.048,0.042
		%m_mieG = 0.75
		%useOzone = True
		%ozoneAbsorption = 0,0.0012,0.005
		%ozoneHeight = 60
		%ozoneFalloff = 40
		%averageGroundReflectance = 0.15
		%specR = 0
		%specG = 0
		%specB = 0
	}
}

// Titan: nitrogen at 1.47 bar and 94 K, 4.4 times Earth's molecules at the ground (its scale height there about 20 km),
// whose own blue scattering lies under the haze and is mostly hidden by it (taken as Earth's), under the orange haze of organic dust that hides the ground in visible light, a hundred and more kilometres deep. The
// haze takes blue light out more than red (it absorbs it); Scatterer's haze dims each colour by what it scatters, so the
// colour is given as more red scattered than blue (optical depths 3, 1.5 and 0.6) and the blue taken out by an absorbing
// layer round 100 km, as Scatterer takes Earth's ozone. Seen from space an orange ball; from the ground a dim orange sky.
// (A likeness of what is seen, not the haze's measured spectrum.)
@Scatterer_atmosphere:HAS[@Atmo:HAS[#name[Laythe]]]:NEEDS[Scatterer]:FOR[RealWorlds]
{
	@Atmo:HAS[#name[Laythe]]
	{
		%HR = 20
		%HM = 50
		%m_betaR = 0.0058,0.0136,0.0331
		%BETA_MSca = 0.02,0.01,0.004
		%m_mieG = 0.7
		%useOzone = True
		%ozoneAbsorption = 0,0.004,0.012
		%ozoneHeight = 100
		%ozoneFalloff = 80
		%averageGroundReflectance = 0.1
		%adjustScaledTexture = False
	}
}

// Scatterer's list of worlds: no sea on Venus (Eve) or Titan (Laythe), whose stock entries draw one over the whole world
// (Titan's lakes are small and lie near its poles; Venus has none); and each world's eclipses cast by its real moons
// (Enceladus, Titan and Deimos are no longer where Minmus, Laythe and Gilly were: Saturn's two and Mars's).
@Scatterer_planetsList:NEEDS[Scatterer]:FOR[RealWorlds]
{
	@scattererCelestialBodies
	{
		@Item:HAS[#celestialBodyName[Kerbin]]
		{
			!eclipseCasters {}
			eclipseCasters
			{
				Item = Mun
			}
		}
		@Item:HAS[#celestialBodyName[Duna]]
		{
			!eclipseCasters {}
			eclipseCasters
			{
				Item = Ike
				Item = Gilly
			}
		}
		@Item:HAS[#celestialBodyName[Laythe]]
		{
			%hasOcean = False
			!eclipseCasters {}
			eclipseCasters
			{
				Item = Saturn
			}
		}
		// (Jupiter: none; from space it shows its clouds, and Scatterer's sky over them washed half its disc blue)
		!Item:HAS[#celestialBodyName[Jool]] {}
		@Item:HAS[#celestialBodyName[Eve]]
		{
			%hasOcean = False
			!eclipseCasters {}
		}
	}
}
