// Real Worlds: Environmental Visual Enhancements' stock layers that do not belong on the real worlds.
// Jool's green bands of cloud would lie over Jupiter's own; Laythe's white clouds over Titan, whose sky is an orange
// haze; Eve's purple layers 4 to 12 km up over Venus, whose cloud deck lies 48 to 70 km up and is seen in its far-away
// picture; Duna's clouds over Mars, white blots on its red from orbit (seen 2026-10-14); Kerbin's own clouds, made for a
// world a tenth of Earth's size and stretched over it, blotches with rims from afar (seen the same day: Natural Weather
// draws Earth's clouds where it is installed); and Kerbin's city lights would light Kerbin's cities on Earth's night side.
// (A patch to a root node names it alone: "@EVE_CLOUDS" reaches every such node. ",*" goes on the deletions inside, or
// only the first matching layer goes: Eve has five.)
@EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements]:FOR[RealWorlds]
{
	!OBJECT:HAS[#body[Jool]],* {}
	!OBJECT:HAS[#body[Laythe]],* {}
	!OBJECT:HAS[#body[Eve]],* {}
	!OBJECT:HAS[#body[Duna]],* {}
	!OBJECT:HAS[#body[Kerbin]],* {}
}
@EVE_CITY_LIGHTS:NEEDS[EnvironmentalVisualEnhancements]:FOR[RealWorlds]
{
	!OBJECT:HAS[#body[Kerbin]],* {}
}
